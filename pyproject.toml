[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-realtime-notifications"
version = "0.1.0"
description = "Typed property-management notifications delivered through Infrai realtime channels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/property_notify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

